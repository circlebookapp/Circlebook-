<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minimal Upload Test</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5;padding:20px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
button, label{padding:12px 20px;border-radius:999px;border:none;font-weight:700;font-size:14px;cursor:pointer;display:inline-block;margin:4px}
</style>
</head>
<body>
<h2>Minimal Upload Test - CircleBook</h2>
<p>If this works, main file has JS error blocking it. If this fails, phone/browser blocks file input.</p>

<div class="card">
<h3>Test 1: Direct file inputs (should always work)</h3>
<input type="file" id="test1" accept="image/*" style="margin:8px 0"><br>
<input type="file" id="test2" accept="video/*" style="margin:8px 0"><br>
<div id="out1"></div>
</div>

<div class="card">
<h3>Test 2: Label method (used in main file)</h3>
<input type="file" id="imgFile" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px">
<input type="file" id="vidFile" accept="video/*" style="position:absolute;left:-9999px;width:1px;height:1px">
<label for="imgFile" style="background:#000;color:#fff">📷 Tap Photo Label</label>
<label for="vidFile" style="background:#000;color:#fff">🎥 Tap Video Label</label>
<div id="out2" style="margin-top:12px"></div>
<img id="prevImg" style="max-width:100%;border-radius:12px;display:none;margin-top:8px">
<video id="prevVideo" controls style="max-width:100%;border-radius:12px;display:none;margin-top:8px;background:#000"></video>
</div>

<div class="card">
<h3>Test 3: Button with JS click</h3>
<input type="file" id="imgFile2" accept="image/*" style="position:absolute;left:-9999px">
<button onclick="document.getElementById('imgFile2').click(); alert('Button clicked - should open gallery')" style="background:#ff6b2b;color:#fff">📷 Button JS Click</button>
<div id="out3"></div>
</div>

<script>
document.getElementById('test1').addEventListener('change', function(e){
  var f=e.target.files[0];
  if(f){ document.getElementById('out1').innerHTML='Image selected: '+f.name+' '+ (f.size/1024).toFixed(1)+'KB ✓'; alert('Test1 Image works: '+f.name); }
});
document.getElementById('test2').addEventListener('change', function(e){
  var f=e.target.files[0];
  if(f){ document.getElementById('out1').innerHTML+='<br>Video selected: '+f.name+' '+ (f.size/1024/1024).toFixed(1)+'MB ✓'; alert('Test1 Video works: '+f.name); }
});

document.getElementById('imgFile').addEventListener('change', function(e){
  var f=e.target.files[0];
  if(!f) return;
  alert('Label Photo works: '+f.name);
  var url=URL.createObjectURL(f);
  var img=document.getElementById('prevImg');
  img.src=url; img.style.display='block';
  document.getElementById('out2').innerText='Photo: '+f.name+' '+(f.size/1024).toFixed(1)+'KB ✓';
});
document.getElementById('vidFile').addEventListener('change', function(e){
  var f=e.target.files[0];
  if(!f) return;
  alert('Label Video works: '+f.name+' '+(f.size/1024/1024).toFixed(1)+'MB');
  var url=URL.createObjectURL(f);
  var vid=document.getElementById('prevVideo');
  vid.src=url; vid.style.display='block';
  document.getElementById('out2').innerText='Video: '+f.name+' '+(f.size/1024/1024).toFixed(1)+'MB ✓';
});

document.getElementById('imgFile2').addEventListener('change', function(e){
  var f=e.target.files[0];
  if(f){ alert('Button JS method works: '+f.name); document.getElementById('out3').innerText='Works: '+f.name; }
});
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu </html>
